name: Real release gates

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  install-gate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            manager: brew
            gate: gate1
            os_label: macos-14
          - runner: ubuntu-24.04
            manager: apt
            gate: gate2
            os_label: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Collect real package-manager results
        run: >-
          cargo run -- collect-real-gate-results
          --manager ${{ matrix.manager }}
          --output artifacts/gates/${{ matrix.gate }}-results.json
          --yes
      - name: Build verified real report
        run: >-
          scripts/gates/build_real_report.sh
          ${{ matrix.gate }}
          ${{ matrix.os_label }}
          artifacts/gates/${{ matrix.gate }}-results.json
          artifacts/gates/${{ matrix.gate }}-report.json
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.gate }}-${{ matrix.os_label }}
          path: artifacts/gates/*.json

  runtime-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Gate 3, 4, and 5 with direct runtime evidence
        run: scripts/gates/run_runtime_gates.sh artifacts/gates ubuntu-24.04
      - uses: actions/upload-artifact@v7
        with:
          name: gate3-gate5-ubuntu-24.04
          path: artifacts/gates/*

  package:
    needs: [install-gate, runtime-gates]
    strategy:
      matrix:
        runner: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Verify embedded defaults outside the source tree
        run: |
          temp_dir="$(mktemp -d)"
          cd "$temp_dir"
          "$GITHUB_WORKSPACE/target/release/t4e" validate
      - name: Package binary and checksum
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == "$GITHUB_REF_NAME" ]]; then version="0.1.0-dev"; fi
          platform="$(printf '%s-%s' "$RUNNER_OS" "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          scripts/package_release.sh target/release/t4e artifacts/release "$version" "$platform"
      - uses: actions/upload-artifact@v7
        with:
          name: t4e-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/release/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: t4e-*
          path: artifacts/release
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/release/*
