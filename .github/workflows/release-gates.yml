name: Real release gates

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  install-gate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            manager: brew
            gate: gate1
            os_label: macos-14
          - runner: ubuntu-24.04
            manager: apt
            gate: gate2
            os_label: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Collect real package-manager results
        run: >-
          cargo run -- collect-real-gate-results
          --manager ${{ matrix.manager }}
          --output artifacts/gates/${{ matrix.gate }}-results.json
          --yes
      - name: Build verified real report
        run: >-
          scripts/gates/build_real_report.sh
          ${{ matrix.gate }}
          ${{ matrix.os_label }}
          artifacts/gates/${{ matrix.gate }}-results.json
          artifacts/gates/${{ matrix.gate }}-report.json
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.gate }}-${{ matrix.os_label }}
          path: artifacts/gates/*.json

  runtime-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Gate 3, 4, and 5 with direct runtime evidence
        run: scripts/gates/run_runtime_gates.sh artifacts/gates ubuntu-24.04
      - uses: actions/upload-artifact@v7
        with:
          name: gate3-gate5-ubuntu-24.04
          path: artifacts/gates/*

  package:
    needs: [install-gate, runtime-gates]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the existing Apple Silicon release artifact unchanged.
          - runner: macos-14
            target: ""
            binary: target/release/t4e
            asset_label: macos-arm64
            use_zig: false
          # cargo-zigbuild links these targets with Zig's musl toolchains, so
          # neither target needs a native GitHub-hosted runner.
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            binary: target/x86_64-unknown-linux-musl/release/t4e
            asset_label: linux-x86_64-musl
            use_zig: true
          - runner: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            binary: target/aarch64-unknown-linux-musl/release/t4e
            asset_label: linux-aarch64-musl
            use_zig: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux cross-compilation toolchain
        if: matrix.use_zig
        uses: mlugg/setup-zig@v2
      - name: Install cargo-zigbuild
        if: matrix.use_zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build release binary
        run: |
          if [[ -n "${{ matrix.target }}" ]]; then
            rustup target add "${{ matrix.target }}"
            cargo zigbuild --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked
          fi
      - name: Install AArch64 emulator for cross-binary validation
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-user-static
      - name: Verify embedded defaults outside the source tree
        run: |
          temp_dir="$(mktemp -d)"
          cd "$temp_dir"
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-musl" ]]; then
            qemu-aarch64-static "$GITHUB_WORKSPACE/${{ matrix.binary }}" validate
          else
            "$GITHUB_WORKSPACE/${{ matrix.binary }}" validate
          fi
      - name: Package binary and checksum
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == "$GITHUB_REF_NAME" ]]; then version="0.1.0-dev"; fi
          scripts/package_release.sh "${{ matrix.binary }}" artifacts/release "$version" "${{ matrix.asset_label }}"
      - uses: actions/upload-artifact@v7
        with:
          name: t4e-${{ matrix.asset_label }}
          path: artifacts/release/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: t4e-*
          path: artifacts/release
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/release/*
