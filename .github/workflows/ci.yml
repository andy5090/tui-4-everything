name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "assets/branding/**"
      - ".omc/**"
      - ".omx/**"
      - ".editorconfig"
      - ".gitattributes"
      - ".gitignore"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "assets/branding/**"
      - ".omc/**"
      - ".omx/**"
      - ".editorconfig"
      - ".gitattributes"
      - ".gitignore"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: scripts/gates/run_all.sh
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
