packs:
  - id: music-pack
    title: Music Pack
    exposure: starter
    tool_ids: [spotatui, spotify-player, ncspot, cava, termusic, mpv]
  - id: video-pack
    title: Video Pack
    exposure: starter
    tool_ids: [mpv, yewtube, yt-dlp, ffmpeg, streamlink, mediainfo]
  - id: podcasts-reading-pack
    title: Podcasts & Reading Pack
    exposure: starter
    tool_ids: [shellcast, newsboat, glow, jq, yq, tldr, less]
  - id: files-pack
    title: Files Pack
    exposure: starter
    tool_ids: [yazi, bat, eza, fd, ripgrep, fzf, zoxide, dust, duf, ncdu, broot, tree, file, p7zip, unzip, rsync]
  - id: fun-pack
    title: Fun Pack
    exposure: starter
    tool_ids: [cmatrix, bastet, asciiquarium, sl, lolcat, cowsay, fortune, tty-clock, nyancat, pipes-sh, ninvaders, nudoku]
  - id: edit-pack
    title: Edit Pack
    exposure: starter
    tool_ids: [micro, helix, neovim, visidata]
  - id: ide-pack
    title: IDE Pack
    exposure: search_only
    tool_ids: [lazyvim]
  - id: agents-pack
    title: Agents Pack
    exposure: search_only
    tool_ids: [claude-code, codex-cli, opencode]

tools:
  - id: spotatui
    name: "Spotatui"
    description: "A Spotify TUI focused on browsing, discovery, and playback control."
    category: entertainment
    tags: []
    audience: general
    risk: SAFE
    exposure: starter
    run:
      cmd: "spotatui"
    installers:
      - platform: macos
        method: brew
        package_hints: ["spotatui"]
      - platform: linux
        method: cargo
        package_hints: ["spotatui"]
        system_packages: ["pkg-config", "libssl-dev", "xorg-dev", "libpipewire-0.3-dev", "libspa-0.2-dev"]
